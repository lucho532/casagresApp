services:
  # ------------------------------------------------------------
  # Frontend (build estático de React con Vite)
  #
  # El backend YA NO vive en Render (se movió a Railway, que da disco
  # persistente y no bloquea los puertos SMTP salientes) — se dejó a
  # propósito de que este Blueprint ya no lo declare, para no arriesgarse
  # a recrear por accidente el servicio viejo si algún día se vuelve a
  # sincronizar. El frontend, en cambio, sigue aquí: los sitios estáticos
  # de Render son gratis y no tienen los mismos problemas.
  # ------------------------------------------------------------
  - type: web
    name: casagres-frontend
    runtime: static
    buildCommand: cd app_react && npm ci && npm run build
    staticPublishPath: app_react/dist
    envVars:
      # Se incrusta en el build (Vite), así que cambiarla requiere volver
      # a desplegar el sitio estático.
      - key: VITE_API_URL
        sync: false
    routes:
      # Enrutamiento del lado del cliente (React Router-style): cualquier
      # ruta que no sea un archivo real cae en index.html.
      - type: rewrite
        source: /*
        destination: /index.html
