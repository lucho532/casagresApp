server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html para
    # que el enrutamiento del lado del cliente (React) se encargue de ella.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre (los que genera el build de Vite)
    # pueden cachearse de forma agresiva; index.html no, porque es el que
    # apunta a la versión vigente de esos archivos.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
